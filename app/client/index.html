<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn HTML, CSS, JavaScript and React from scratch. Every lesson: teach, example, task, your code, a score out of 10 and the mistakes you made." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Frontend Lab</title>
    <script>
      // Apply the saved theme before first paint, so there is no flash.
      try {
        const theme = localStorage.getItem('frontend-lab:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
